<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Concordia · Seguridad</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
  --primary: #1a5490; --primary-dark: #0f3a66;
  --accent: #2ecc71; --danger: #e74c3c; --warning: #f39c12; --info: #3498db;
  --bg: #f0f4f8; --text: #2c3e50; --text-muted: #7f8c8d; --border: #e1e8ed;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
  --radius: 14px; --radius-sm: 8px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100vh;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-text-size-adjust: 100%; touch-action: manipulation;
}
.d-none-lc { display: none !important; }

.login-wrapper {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: linear-gradient(135deg, #1a5490, #0f3a66);
  flex-direction: column;
}
.login-card {
  background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 36px 28px; width: 100%; max-width: 420px;
}
.login-logo { text-align: center; margin-bottom: 24px; }
.login-logo i {
  font-size: 3rem; color: var(--primary); background: rgba(26,84,144,0.1);
  width: 80px; height: 80px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;
}
.login-title { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin: 0; }
.login-subtitle { color: var(--text-muted); font-size: 0.9rem; margin: 4px 0 0; }

.recordar-sesion-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.25s ease;
  user-select: none;
}
.recordar-sesion-wrap:hover { background: #e8eef5; }
.recordar-sesion-wrap input[type="checkbox"] {
  width: 20px; height: 20px; cursor: pointer;
  accent-color: var(--primary); flex-shrink: 0;
}
.recordar-sesion-wrap .recordar-info { flex: 1; min-width: 0; }
.recordar-sesion-wrap .recordar-label {
  font-size: 0.88rem; font-weight: 700; color: var(--text);
  display: block; line-height: 1.2;
}
.recordar-sesion-wrap .recordar-sub {
  font-size: 0.72rem; color: var(--text-muted);
  margin-top: 2px; display: block; line-height: 1.2;
}

.form-label-lc { font-weight: 600; color: var(--text); font-size: 0.9rem; margin-bottom: 6px; display: block; }
.form-control-lc {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 0.95rem; background: #fff;
}
.form-control-lc:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 3px rgba(52,152,219,0.15); }
.input-wrap { position: relative; }
.input-wrap .toggle-pass {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; padding: 4px; font-size: 1rem;
}
.btn-lc {
  padding: 12px 22px; border-radius: var(--radius-sm);
  border: none; font-weight: 700; font-size: 0.95rem;
  cursor: pointer; transition: all 0.25s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-lc-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-lc-primary:hover { background: var(--primary-dark); color: #fff; }
.btn-lc-success { background: var(--accent); color: #fff; }
.btn-lc-success:hover { background: #27ae60; color: #fff; }
.btn-lc-danger { background: var(--danger); color: #fff; }
.btn-lc-warning { background: var(--warning); color: #fff; }
.btn-lc-info { background: var(--info); color: #fff; }
.btn-lc-ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-lc-sm { padding: 7px 14px; font-size: 0.83rem; }
.btn-lc:disabled { opacity: 0.6; cursor: not-allowed; }

.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  box-shadow: var(--shadow-lg); position: sticky; top: 0; z-index: 100;
}
.header-brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.header-brand i {
  font-size: 1.6rem; background: rgba(255,255,255,0.15);
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.header-brand-title { font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
.header-brand-subtitle { font-size: 0.72rem; opacity: 0.8; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.header-btn {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; cursor: pointer; transition: all 0.25s ease;
}
.header-btn:hover { background: rgba(255,255,255,0.25); }
.header-btn.spinning i { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.container-main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

.card-lc {
  background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px; margin-bottom: 20px;
  border: 1px solid var(--border);
}

.scan-btn {
  width: 100%;
  padding: 28px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  box-shadow: 0 8px 24px rgba(26,84,144,0.35);
  transition: all 0.25s ease;
}
.scan-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(26,84,144,0.45); }
.scan-btn i { font-size: 2.5rem; }

.manual-box { margin-top: 18px; }
.manual-box input {
  width: 100%;
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-family: monospace;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.manual-box input:focus { outline: none; border-color: var(--info); }

#qrReaderWrapper {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  display: none;
  flex-direction: column;
}
#qrReaderWrapper.show { display: flex; }
#qrReaderWrapper .qr-header {
  background: rgba(0,0,0,0.85);
  color: #fff; padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
#qrReaderWrapper .qr-header .qr-title {
  font-weight: 700; font-size: 1rem;
}
#qrReaderWrapper .qr-close {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#qrReader { flex: 1; position: relative; }
#qrReader video { width: 100% !important; height: 100% !important; object-fit: cover; }
#qrReaderWrapper .qr-hint {
  background: rgba(0,0,0,0.85); color: #fff;
  padding: 12px 18px; font-size: 0.85rem; text-align: center;
}

.resultado-fullscreen {
  position: fixed; inset: 0; z-index: 9998;
  display: none;
  flex-direction: column;
  padding: 22px;
  color: #fff;
  overflow-y: auto;
}
.resultado-fullscreen.show { display: flex; }
.resultado-fullscreen.verde { background: linear-gradient(160deg, #27ae60, #1e8449); }
.resultado-fullscreen.rojo { background: linear-gradient(160deg, #c0392b, #922b21); }
.resultado-fullscreen.naranja { background: linear-gradient(160deg, #d68910, #b9770e); }
.resultado-fullscreen .res-icon {
  font-size: 5rem;
  text-align: center;
  margin-top: 40px;
  margin-bottom: 20px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.resultado-fullscreen .res-title {
  font-size: 1.8rem;
  font-weight: 900;
  text-align: center;
  letter-spacing: 1px;
  margin-bottom: 14px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
.resultado-fullscreen .res-message {
  text-align: center;
  font-size: 1rem;
  opacity: 0.95;
  margin-bottom: 24px;
}
.resultado-fullscreen .res-datos {
  background: rgba(255,255,255,0.15);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 20px;
  backdrop-filter: blur(8px);
}
.resultado-fullscreen .res-datos .fila {
  display: flex; justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  font-size: 0.92rem;
}
.resultado-fullscreen .res-datos .fila:last-child { border-bottom: none; }
.resultado-fullscreen .res-datos .fila .lbl { opacity: 0.85; }
.resultado-fullscreen .res-datos .fila .val { font-weight: 800; text-align: right; }
.resultado-fullscreen .btn-cerrar {
  margin-top: auto;
  padding: 18px;
  font-size: 1.1rem;
  font-weight: 800;
  background: #fff;
  color: var(--primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.historial-lista { margin-top: 8px; }
.historial-item {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  align-items: center;
  font-size: 0.85rem;
}
.historial-item .hora {
  font-weight: 800;
  color: var(--primary);
  min-width: 55px;
}
.historial-item .info { flex: 1; }
.historial-item .info .casa { font-weight: 700; }
.historial-item .info .detalle { color: var(--text-muted); font-size: 0.78rem; }
.historial-item .badge {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: 800;
  color: #fff;
}
.historial-item .badge.ok { background: var(--accent); }
.historial-item .badge.fail { background: var(--danger); }
.historial-item .badge.warn { background: var(--warning); }

.empty-state { text-align: center; padding: 30px 20px; color: var(--text-muted); }
.empty-state i { font-size: 2.5rem; opacity: 0.3; margin-bottom: 10px; display: block; }
</style>
</head>
<body>

<!-- ================ LOGIN ================ -->
<div id="pantallaLogin" class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <i class="fas fa-shield-alt"></i>
      <h1 class="login-title">La Concordia</h1>
      <p class="login-subtitle">Control de Accesos · Seguridad</p>
    </div>
    <form id="formLogin" onsubmit="return false;">
      <div class="mb-3" style="margin-bottom: 14px;">
        <label class="form-label-lc">Contraseña de seguridad</label>
        <div class="input-wrap">
          <input type="password" class="form-control-lc" id="loginPassInput" placeholder="Contraseña" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" onclick="togglePass('loginPassInput', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <label class="recordar-sesion-wrap">
        <input type="checkbox" id="loginRecordar" checked>
        <div class="recordar-info">
          <span class="recordar-label">Mantener sesión abierta</span>
          <span class="recordar-sub">No tendrás que volver a ingresar</span>
        </div>
      </label>
      <button type="submit" class="btn-lc btn-lc-primary" id="btnLogin">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
    </form>
  </div>
</div>

<!-- ================ PANEL GUARDIA ================ -->
<div id="pantallaGuardia" class="d-none-lc">
  <div class="header">
    <div class="header-brand">
      <i class="fas fa-shield-alt"></i>
      <div>
        <div class="header-brand-title">La Concordia · Seguridad</div>
        <div class="header-brand-subtitle">Guardia</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="refrescarHistorial(this)" title="Refrescar"><i class="fas fa-sync-alt"></i></button>
      <button class="header-btn" onclick="cerrarSesion()" title="Cerrar sesión"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>

  <div class="container-main">
    <div class="card-lc">
      <button class="scan-btn" onclick="abrirEscaner()">
        <i class="fas fa-qrcode"></i>
        <span>Escanear QR</span>
      </button>

      <div class="manual-box">
        <label class="form-label-lc" style="margin-top: 4px;">O ingresa el token manualmente</label>
        <input type="text" id="manualTokenInput" placeholder="LCR-XXXXXXXXXXXX / LCV-XXXXXXXXXXXX" autocapitalize="characters" onkeydown="if(event.key==='Enter'){event.preventDefault();validarManual();}">
        <button class="btn-lc btn-lc-info" style="width: 100%; margin-top: 10px;" onclick="validarManual()">
          <i class="fas fa-check"></i> Validar token
        </button>
      </div>
    </div>

    <div class="card-lc">
      <h3 style="font-size: 1rem; font-weight: 800; color: var(--primary); margin-bottom: 10px;">
        <i class="fas fa-list"></i> Accesos de hoy
      </h3>
      <div id="historialLista" class="historial-lista">
        <div class="empty-state"><i class="fas fa-inbox"></i><p>Sin accesos registrados hoy.</p></div>
      </div>
    </div>
  </div>
</div>

<!-- ================ ESCÁNER ================ -->
<div id="qrReaderWrapper">
  <div class="qr-header">
    <div class="qr-title"><i class="fas fa-camera"></i> Escanear QR</div>
    <button class="qr-close" onclick="cerrarEscaner()"><i class="fas fa-times"></i></button>
  </div>
  <div id="qrReader"></div>
  <div class="qr-hint">Coloca el código QR dentro del recuadro</div>
</div>

<!-- ================ RESULTADO ================ -->
<div id="resultadoFull" class="resultado-fullscreen">
  <div class="res-icon" id="resIcon"><i class="fas fa-check-circle"></i></div>
  <div class="res-title" id="resTitle">PERMITIDO</div>
  <div class="res-message" id="resMessage"></div>
  <div class="res-datos" id="resDatos"></div>
  <button class="btn-cerrar" onclick="cerrarResultado()">
    <i class="fas fa-qrcode"></i> Escanear otro
  </button>
</div>

<script>
const QR_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzeMDkfE-CW2wij3gy0M0LE65yrSevu_SdRqIb3kEp5yjReP7eHRn62FPdHZ-JUqVSD/exec";
const SESSION_KEY = "LaConcordiaGuardiaSesion";
const DB_NAME = "LaConcordiaGuardiaDB";
const DB_VERSION = 1;
const STORE_SESION = "sesion";

let dbGuardia = null;
let currentPassword = "";
let html5QrCode = null;
let scannerActivo = false;

// ============ IndexedDB sesión ============
function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_SESION)) {
        db.createObjectStore(STORE_SESION, { keyPath: "key" });
      }
    };
    req.onsuccess = (e) => { dbGuardia = e.target.result; resolve(dbGuardia); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function guardarSesion(obj) {
  return new Promise((resolve) => {
    if (!dbGuardia) return resolve();
    const tx = dbGuardia.transaction([STORE_SESION], "readwrite");
    tx.objectStore(STORE_SESION).put({ key: SESSION_KEY, ...obj });
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}
function obtenerSesion() {
  return new Promise((resolve) => {
    if (!dbGuardia) return resolve(null);
    const tx = dbGuardia.transaction([STORE_SESION], "readonly");
    const req = tx.objectStore(STORE_SESION).get(SESSION_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
function borrarSesion() {
  return new Promise((resolve) => {
    if (!dbGuardia) return resolve();
    const tx = dbGuardia.transaction([STORE_SESION], "readwrite");
    tx.objectStore(STORE_SESION).delete(SESSION_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}

// ============ API ============
async function apiQR(payload, timeoutMs = 20000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(QR_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      signal: controller.signal,
      redirect: "follow"
    });
    if (!resp.ok) throw new Error("Error HTTP " + resp.status);
    const texto = await resp.text();
    if (!texto) throw new Error("Respuesta vacía.");
    if (texto.trim().startsWith("<")) throw new Error("Revisa el deployment.");
    let data;
    try { data = JSON.parse(texto); } catch (e) { throw new Error("Respuesta no es JSON"); }
    if (data.status === "error") throw new Error(data.message || "Error desconocido");
    return data.data;
  } catch (err) {
    if (err.name === "AbortError") throw new Error("Timeout.");
    if (err.message && err.message.includes("Failed to fetch")) throw new Error("Sin conexión al servidor.");
    throw err;
  } finally { clearTimeout(timer); }
}

// ============ LOGIN ============
function togglePass(inputId, btn) {
  const el = document.getElementById(inputId);
  if (el.type === "password") { el.type = "text"; btn.innerHTML = '<i class="fas fa-eye-slash"></i>'; }
  else { el.type = "password"; btn.innerHTML = '<i class="fas fa-eye"></i>'; }
}

document.getElementById("formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = document.getElementById("loginPassInput").value;
  const recordar = document.getElementById("loginRecordar").checked;
  if (!password) return Swal.fire("Falta contraseña", "Ingresa la contraseña.", "warning");

  const btn = document.getElementById("btnLogin");
  const htmlOrig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

  try {
    await apiQR({ action: "validarPasswordSeguridad", password });
    currentPassword = password;

    if (recordar) {
      await guardarSesion({ password, recordar: true });
    } else {
      await borrarSesion();
    }

    mostrarPantalla("guardia");
    await cargarHistorial();
  } catch (err) {
    Swal.fire("Error", err.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = htmlOrig;
  }
});

function cerrarSesion() {
  Swal.fire({
    title: "¿Cerrar sesión?", icon: "question",
    showCancelButton: true, confirmButtonText: "Sí, salir", cancelButtonText: "Cancelar",
    confirmButtonColor: "#e74c3c"
  }).then(async (r) => {
    if (r.isConfirmed) {
      await borrarSesion();
      currentPassword = "";
      mostrarPantalla("login");
      document.getElementById("loginPassInput").value = "";
      document.getElementById("loginRecordar").checked = true;
    }
  });
}

function mostrarPantalla(cual) {
  document.getElementById("pantallaLogin").classList.toggle("d-none-lc", cual !== "login");
  document.getElementById("pantallaGuardia").classList.toggle("d-none-lc", cual !== "guardia");
}

// ============ ESCÁNER ============
async function abrirEscaner() {
  const wrapper = document.getElementById("qrReaderWrapper");
  wrapper.classList.add("show");

  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("qrReader", {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      verbose: false
    });
  }

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText) => { onQRLeido(decodedText); },
      (err) => { /* ignorar */ }
    );
    scannerActivo = true;
  } catch (err) {
    console.error("Error cámara:", err);
    Swal.fire("Cámara no disponible", "No se pudo abrir la cámara. Puedes ingresar el token manualmente. (" + err.message + ")", "warning");
    cerrarEscaner();
  }
}

async function cerrarEscaner() {
  const wrapper = document.getElementById("qrReaderWrapper");
  wrapper.classList.remove("show");
  if (html5QrCode && scannerActivo) {
    try {
      await html5QrCode.stop();
      await html5QrCode.clear();
    } catch (e) {}
    scannerActivo = false;
  }
}

let ultimoTokenEscaneado = "";
let ultimoTimestampEscaneo = 0;

function onQRLeido(token) {
  const ahora = Date.now();
  if (token === ultimoTokenEscaneado && (ahora - ultimoTimestampEscaneo) < 2500) return;
  ultimoTokenEscaneado = token;
  ultimoTimestampEscaneo = ahora;
  cerrarEscaner();
  validarToken(token);
}

function validarManual() {
  const input = document.getElementById("manualTokenInput");
  const token = input.value.trim().toUpperCase();
  if (!token) return Swal.fire("Token vacío", "Escribe un token.", "warning");
  input.value = "";
  validarToken(token);
}

async function validarToken(token) {
  Swal.fire({
    title: "Validando...",
    html: "Consultando el código.",
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  try {
    const res = await apiQR({
      action: "qrValidar",
      token,
      guardia: "Guardia"
    });
    Swal.close();
    mostrarResultado(res);
    await cargarHistorial();
  } catch (err) {
    Swal.fire("Error", err.message, "error");
  }
}

// ============ RESULTADO ============
function mostrarResultado(res) {
  const full = document.getElementById("resultadoFull");
  const iconEl = document.getElementById("resIcon");
  const titleEl = document.getElementById("resTitle");
  const messageEl = document.getElementById("resMessage");
  const datosEl = document.getElementById("resDatos");

  full.classList.remove("verde", "rojo", "naranja");

  if (res.estado === "permitido") {
    full.classList.add("verde");
    iconEl.innerHTML = '<i class="fas fa-check-circle"></i>';
    titleEl.textContent = "ACCESO PERMITIDO";
  } else if (res.estado === "vencido" || res.estado === "usado") {
    full.classList.add("naranja");
    iconEl.innerHTML = res.estado === "vencido"
      ? '<i class="fas fa-hourglass-end"></i>'
      : '<i class="fas fa-redo-alt"></i>';
    titleEl.textContent = res.estado === "vencido" ? "CÓDIGO VENCIDO" : "CÓDIGO YA USADO";
  } else {
    full.classList.add("rojo");
    iconEl.innerHTML = '<i class="fas fa-times-circle"></i>';
    titleEl.textContent = res.estado === "revocado" ? "CÓDIGO REVOCADO" : "CÓDIGO INVÁLIDO";
  }

  messageEl.textContent = res.mensaje || "";

  const d = res.datos;
  if (d) {
    const filas = [];
    if (d.casa) filas.push(["Casa", d.casa]);
    if (d.nombreVisitante) filas.push(["Visitante", d.nombreVisitante]);
    if (d.placa) filas.push(["Placa", d.placa]);
    if (d.cantidadPersonas) filas.push(["Personas", String(d.cantidadPersonas)]);
    if (d.expira) filas.push(["Expira", d.expira]);
    if (d.usosMax > 0) filas.push(["Usos", `${d.usosActuales} / ${d.usosMax}`]);
    if (d.notas) filas.push(["Notas", d.notas]);

    datosEl.innerHTML = filas.map(f =>
      `<div class="fila"><span class="lbl">${f[0]}</span><span class="val">${escapeHtml(f[1])}</span></div>`
    ).join("");
    datosEl.style.display = filas.length ? "block" : "none";
  } else {
    datosEl.innerHTML = "";
    datosEl.style.display = "none";
  }

  full.classList.add("show");
}

function cerrarResultado() {
  document.getElementById("resultadoFull").classList.remove("show");
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// ============ HISTORIAL ============
async function cargarHistorial() {
  const cont = document.getElementById("historialLista");
  cont.innerHTML = '<div class="empty-state"><p>Cargando...</p></div>';
  try {
    const res = await apiQR({
      action: "qrListarRegistrosDelDia",
      password: currentPassword,
      guardia: "Guardia"
    });
    const regs = res.registros || [];
    if (regs.length === 0) {
      cont.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Sin accesos registrados hoy.</p></div>';
      return;
    }
    cont.innerHTML = regs.map(r => {
      let badgeClass = "warn";
      if (r.resultado === "PERMITIDO") badgeClass = "ok";
      else if (r.resultado === "VENCIDO" || r.resultado === "YA-USADO") badgeClass = "warn";
      else badgeClass = "fail";
      return `
        <div class="historial-item">
          <div class="hora">${r.fechaHora}</div>
          <div class="info">
            <div class="casa">${escapeHtml(r.casa || "—")} · ${escapeHtml(r.tipo)}</div>
            <div class="detalle">Guardia: ${escapeHtml(r.guardia)}</div>
          </div>
          <div class="badge ${badgeClass}">${r.resultado}</div>
        </div>`;
    }).join("");
  } catch (err) {
    cont.innerHTML = `<div class="empty-state"><p>${escapeHtml(err.message)}</p></div>`;
  }
}

async function refrescarHistorial(btn) {
  btn.classList.add("spinning");
  try { await cargarHistorial(); } finally { btn.classList.remove("spinning"); }
}

// ============ AUTO-LOGIN (solo si el usuario marcó "Mantener sesión abierta") ============
document.addEventListener("DOMContentLoaded", async () => {
  try {
    await abrirDB();
    const ses = await obtenerSesion();
    if (ses && ses.password && ses.recordar === true) {
      try {
        await apiQR({ action: "validarPasswordSeguridad", password: ses.password });
        currentPassword = ses.password;
        mostrarPantalla("guardia");
        await cargarHistorial();
        return;
      } catch (e) {
        await borrarSesion();
      }
    }
  } catch (e) {
    console.warn("Sin IndexedDB:", e);
  }
  mostrarPantalla("login");
});
</script>
